[package]
name = "iced-pomelo-gfx"
version = "0.1.0"
edition = "2021"
description = "iced's renderer contract, implemented over pomelo-gfx: records a frame's commands instead of rasterising it, so the platform can replay them into RGB565"
license = "GPL-3.0-only"
repository = "https://github.com/pomelos-on-sale/iced-pomelo-gfx"

[features]
# One timing line per painted frame, split by phase (see the `profile` module). Off by default: a
# build that is not measuring must not read the clock twice per glyph for numbers nobody reads.
profile = []

default = []

[dependencies]
pomelo-gfx = { path = "../pomelo-gfx" }

iced_core = { path = "../iced/core" }
raw-window-handle = "0.6"
iced_graphics = { path = "../iced/graphics", features = ["geometry"] }
lyon_path = "1.0"

